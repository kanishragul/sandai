<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up • Sandai League</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body data-page="signup">
    <main class="section">
      <div class="container" style="max-width: 540px;">
        <section class="panel">
          <div class="section-heading">
            <div>
              <h1>Create your account</h1>
              <p>Register as a new player and join the tournament experience.</p>
            </div>
          </div>
          <form id="signup-form" class="form-grid">
            <div>
              <label for="signup-name">Full name</label>
              <input id="signup-name" name="name" type="text" />
              <div id="signup-name-error" class="error-text"></div>
            </div>
            <div>
              <label for="signup-username">Username</label>
              <input id="signup-username" name="username" type="text" />
              <div id="signup-username-error" class="error-text"></div>
            </div>
            <div>
              <label for="signup-password">Password</label>
              <input id="signup-password" name="password" type="password" />
              <div id="signup-password-error" class="error-text"></div>
            </div>
            <button class="btn btn-primary" type="submit">Sign up</button>
            <p class="muted">Already have an account? <a href="./index.html">Sign in instead</a>.</p>
          </form>
        </section>
      </div>
    </main>
    <script src="./js/data.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
