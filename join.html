<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join • Sandai League</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body data-page="join">
    <main class="section">
      <div class="container" style="max-width: 520px;">
        <section class="panel">
          <div class="section-heading">
            <div>
              <h1>Join the tournament</h1>
              <p>Provide your name, team, and game preference so the match experience is personalized.</p>
            </div>
          </div>
          <form id="join-form" class="form-grid">
            <div>
              <label for="join-name">Your name</label>
              <input id="join-name" name="name" type="text" />
              <div id="join-name-error" class="error-text"></div>
            </div>
            <div>
              <label for="join-team">Team name</label>
              <input id="join-team" name="team" type="text" />
              <div id="join-team-error" class="error-text"></div>
            </div>
            <div>
              <label for="join-game">Game / sport</label>
              <input id="join-game" name="game" type="text" />
              <div id="join-game-error" class="error-text"></div>
            </div>
            <button class="btn btn-primary" type="submit">Enter tournament</button>
            <p class="muted">This session stores your registration data in localStorage so the experience feels new and personal.</p>
          </form>
        </section>
      </div>
    </main>
    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
