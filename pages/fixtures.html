<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixtures • Sandai League</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="fixtures">
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="../index.html">
          <span class="brand-mark">S</span>
          <span>Sandai League</span>
        </a>
        <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-label="Toggle navigation">☰</button>
        <nav class="site-nav" data-site-nav>
          <a href="../index.html">Home</a>
          <a href="./teams.html">Teams</a>
          <a class="active" href="./fixtures.html">Fixtures</a>
          <a href="./schedule.html">Schedule</a>
          <a href="./standings.html">Standings</a>
          <a href="./results.html">Results</a>
          <a href="./statistics.html">Statistics</a>
          <a href="./announcements.html">Announcements</a>
          <a href="./gallery.html">Gallery</a>
          <a href="./about.html">About</a>
          <a href="./contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="section-heading">
          <div>
            <h1 data-page-title>Fixtures</h1>
            <p>Organized by status and easily filtered by team or venue.</p>
          </div>
        </div>
        <div class="filters">
          <div class="filter-group">
            <label for="match-search">Search fixtures</label>
            <input id="match-search" type="search" placeholder="Search venue or teams" />
          </div>
          <div class="filter-group">
            <label for="match-status">Status</label>
            <select id="match-status">
              <option value="all">All statuses</option>
              <option value="upcoming">Upcoming</option>
              <option value="live">Live</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="match-team">Team</label>
            <select id="match-team"></select>
          </div>
        </div>
        <div id="match-list" class="section-grid"></div>
      </div>
    </main>

    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
