<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login • Sandai League</title>
    <meta name="description" content="Sign in to Sandai League and join the tournament experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body data-page="login">
    <main class="section">
      <div class="container" style="max-width: 520px;">
        <section class="panel">
          <div class="section-heading">
            <div>
              <h1>Sandai League</h1>
              <p>Player login to enter the tournament hub.</p>
            </div>
          </div>
          <form id="login-form" class="form-grid">
            <div>
              <label for="login-username">Username</label>
              <input id="login-username" name="username" type="text" autocomplete="username" />
              <div id="login-username-error" class="error-text"></div>
            </div>
            <div>
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" />
              <div id="login-password-error" class="error-text"></div>
            </div>
            <button class="btn btn-primary" type="submit">Continue</button>
            <p class="muted">Use the provided username and password to continue. This is a frontend demo session only.</p>
          </form>
        </section>
      </div>
    </main>

    <script src="./js/data.js"></script>
    <script src="./js/auth.js"></script>    <script src="./js/auth.js"></script>    <script src="./js/app.js"></script>
  </body>
</html>
